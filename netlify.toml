[build]
  command = "npm ci && npx vite build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[functions."lembretes-cron"]
  schedule = "*/5 * * * *"

# 12:00 UTC = 9h em Brasília (UTC-3) — uma vez por dia é suficiente, já que
# lembrete_enviado_em evita reenvio da mesma cobrança em execuções seguintes.
[functions."honorarios-cron"]
  schedule = "0 12 * * *"

# 13:00 UTC = 10h em Brasília — depois do horário em que o escritório
# costuma logar de novo no OneFlow de manhã (of_user_token dura ~23h e não
# renova sozinho), pra ter mais chance de achar o token válido.
[functions."documentos-fiscais-cron"]
  schedule = "0 13 * * *"

# Extrato importado pelo grupo Documentos do WhatsApp: função ESM que usa
# código de src/lib (compartilhado com a tela) — esbuild empacota isso; o
# pdf.js e o pdf-lib vão como node_modules (pdf.js carrega o worker sozinho).
[functions."importar-extrato-background"]
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist", "@cantoo/pdf-lib"]

# Processamento dos documentos do grupo Documentos do WhatsApp (menu: Simples,
# CND, parcelamento, baixa, painel): usa src/lib/guiaParcelamento.js (o mesmo
# código da tela Parcelamentos) e o pdf.js pra ler a guia de parcelamento.
[functions."documento-processar-background"]
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist"]

# Link curto do painel (/p/<codigo>) — antes do catch-all do app
[[redirects]]
  from = "/p/:codigo"
  to = "/.netlify/functions/link-curto?c=:codigo"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
