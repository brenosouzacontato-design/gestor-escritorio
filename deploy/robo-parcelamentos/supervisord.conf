[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

; tela virtual onde o Chromium do robô roda
[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

; VNC só dentro do container (localhost); quem sai pra fora é o noVNC, via Caddy
[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900 -quiet
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
priority=30
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:robo]
command=python /app/robo.py agendar
directory=/app
priority=40
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
