<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor Contábil</title>
    <!-- app instalável no tablet; os links públicos do painel trocam por
         painel.webmanifest (main.jsx remove este e painelPush.js põe o dele) -->
    <link rel="manifest" id="manifest-gestor" href="/gestor.webmanifest" />
    <meta name="theme-color" content="#1B2B4B" />
    <link rel="apple-touch-icon" href="/icons/gestor-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // aplica o tema salvo antes do React montar, pra não piscar (mesma regra de src/lib/tema.js)
      var t = 'areia';
      try {
        var salvo = localStorage.getItem('tema');
        if (salvo === 'areia' || salvo === 'cinza' || salvo === 'dark') t = salvo;
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
